name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so two quick pushes cannot publish the same tag twice.
concurrency:
  group: NeoTube-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # A tag was pushed explicitly: release exactly that version.
            VERSION="${GITHUB_REF_NAME#v}"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            # A normal push to main: bump the patch version automatically.
            CURRENT="$(python3 -c 'import json; print(json.load(open("app-config.json"))["version"]["name"])')"
            BASE="${CURRENT%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            MAJOR="${MAJOR:-0}"
            MINOR="${MINOR:-1}"
            PATCH="${PATCH:-0}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_name=$(python3 -c 'import json; print(json.load(open("app-config.json"))["app"]["name"])')" >> "$GITHUB_OUTPUT"
          echo "package=$(python3 -c 'import json; print(json.load(open("app-config.json"))["app"]["packageName"])')" >> "$GITHUB_OUTPUT"
          echo "repo_url=$(python3 -c 'import json; print(json.load(open("app-config.json"))["update"]["repoUrl"])')" >> "$GITHUB_OUTPUT"
          echo "apk_asset=$(python3 -c 'import json; print(json.load(open("app-config.json"))["update"]["apkAsset"])')" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Bump version for this build
        if: steps.version.outputs.bump == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import json, sys
          path = "app-config.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["version"]["code"] = int(cfg["version"]["code"]) + 1
          cfg["version"]["name"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
          echo "Build version:"
          python3 -c 'import json; print(json.load(open("app-config.json"))["version"])'

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_asset }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.app_name }}-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.apk_asset }}

      - name: Commit version bump
        if: steps.version.outputs.bump == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-config.json
          if git diff --cached --quiet; then
            echo "Version config unchanged; nothing to commit."
          else
            git commit -m "${{ steps.version.outputs.app_name }} ${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The release action creates the tag through the GitHub API. This
          # avoids a separate `git push` of the annotated tag, which can be
          # rejected by tag protection even when contents: write is granted.
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.app_name }} ${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.apk_asset }}
          body: |
            ${{ steps.version.outputs.app_name }} ${{ steps.version.outputs.version }}

            - NeoTube branding across the app UI
            - Search suggestions and recent searches now follow the signed-in YouTube account
            - YouTube watch history from your signed-in Google account on Home and in the Library
            - Ad-free YouTube and YouTube Music playback with a Liquid Glass UI
            - Personalised Shorts, synced lyrics, and downloads up to 4K HDR
            - Background playback, Picture-in-Picture, and Android TV mode

            Package: `${{ steps.version.outputs.package }}` · Source: ${{ steps.version.outputs.repo_url }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
